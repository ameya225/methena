# R CMD check (including the testthat suite on simulated data) on every push / pull request.
# Runs inside the official Bioconductor container, which ships the system libraries
# (HDF5, curl, xml2, ...) and pre-built Bioconductor binaries, so installs are fast and reliable.
name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:latest
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v5
      - name: Show R / Bioconductor versions
        run: Rscript -e 'sessionInfo(); BiocManager::version()'
      - name: Install dependencies (CRAN + Bioconductor + GitHub)
        run: Rscript inst/scripts/install_dependencies.R --minimal
      - name: Install rcmdcheck
        run: Rscript -e 'if (!requireNamespace("rcmdcheck", quietly = TRUE)) install.packages("rcmdcheck")'
      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), build_args = "--no-build-vignettes", error_on = "error", check_dir = "check")'
      - name: Upload check results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-results
          path: check

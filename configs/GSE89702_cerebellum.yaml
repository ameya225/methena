# Post-mortem brain (cerebellum), schizophrenia vs control (Pidsley/Viana et al. 2017)
project: GSE89702_cerebellum
output_dir: ../results/GSE89702_cerebellum
input:
  type: intensity
  array: 450k
  tissue: brain
  sample_sheet: ../example_data/sample_sheets/GSE89702_linked.tsv
  sample_id_col: geo_accession
  data_id_col: data_id
  meth_file: ../example_data/raw/GSE89702_methylatedintensities_CER_DBCBB.csv.gz
  unmeth_file: ../example_data/raw/GSE89702_unmethylatedintensities_CER_DBCBB.csv.gz
  detp_file: ../example_data/raw/GSE89702_detectionP_CER_DBCBB.csv.gz
phenotype:
  group_col: diagnosis
  control_level: control
  case_level: schizophrenia
  age_col: age
  sex_col: gender
normalization:
  method: dasen
analysis:
  covariates: [age, sex, cells]
  clocks: true
  enrichment: false
  vmp: true
